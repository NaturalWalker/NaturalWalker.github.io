---
layout: default
---
{% include progress.html %}
<div class="wrap">
  <div class="doc-grid">
    <article class="article">
      <div class="crumbs"><a href="{{ '/' | relative_url }}">~</a><span class="sep">/</span><a href="{{ '/blog/' | relative_url }}">blog</a></div>
      <div class="article-head">
        <h1>{{ page.title }}</h1>
        <span class="date">{{ page.date | date: "%d %b, %Y" }}{% if page.category %} · {{ page.category }}{% endif %}</span>
      </div>
      {%- if page.image -%}<img class="article-cover" src="{{ page.image | relative_url }}" alt="">{%- endif -%}
      <div class="prose">
        {{ content }}
      </div>
    </article>
    {% include toc.html %}
  </div>
</div>
